server.port=${PORT:5000}

spring.data.mongodb.uri=${MONGO_ATLAS_URI}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

app.frontend-url=${FRONTEND_URL}
app.allowed-origins=${ALLOWED_ORIGINS}
app.default-admin-email=${DEFAULT_ADMIN_EMAIL}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
spring.data.mongodb.database=${MONGO_DB_NAME:test}
logging.level.org.springframework.data.mongodb.core=WARN
